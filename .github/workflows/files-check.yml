name: Files check

# Automatic and light: nothing is run against a database.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: No tracked .env, SQL parses, script compiles, CSV and README links
        run: uv run --no-project --with sqlglot python .github/scripts/check_files.py
